<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floral Arrangements — JB Farm & Florals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f5f0e8;
    --warm-white: #faf7f2;
    --sage: #7a8c6e;
    --deep-sage: #4a5c3f;
    --terracotta: #c4704a;
    --petal: #f2d4dc;
    --petal-deep: #d4919e;
    --bark: #3d2e1e;
    --straw: #d4bc82;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { background: var(--warm-white); color: var(--bark); font-family: 'DM Sans', sans-serif; font-weight: 300; overflow-x: hidden; }

  nav {
    position: fixed; top: 0; width: 100%; z-index: 100;
    padding: 1.2rem 4rem;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(250,247,242,0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(122,140,110,0.2);
  }
  .nav-logo { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: var(--deep-sage); letter-spacing: 0.04em; text-decoration: none; }
  .nav-logo span { color: var(--terracotta); font-style: italic; }
  .nav-back { font-family: 'DM Sans', sans-serif; font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--bark); text-decoration: none; opacity: 0.6; transition: opacity 0.2s; }
  .nav-back:hover { opacity: 1; }

  .gallery-header {
    padding: 10rem 8rem 4rem;
    background: var(--cream);
  }
  .section-label { font-family: 'DM Sans', sans-serif; font-size: 0.7rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--sage); margin-bottom: 1rem; }
  .gallery-title { font-family: 'Playfair Display', serif; font-size: clamp(2.5rem, 4vw, 4rem); color: var(--bark); line-height: 1.1; margin-bottom: 1rem; }
  .gallery-title em { color: var(--deep-sage); font-style: italic; }
  .gallery-subtitle { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; font-style: italic; color: var(--bark); opacity: 0.65; }

  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.6rem;
    padding: 3rem 8rem 6rem;
    background: var(--warm-white);
  }
  .gallery-item { aspect-ratio: 1; overflow: hidden; background: var(--cream); }
  .gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
  .gallery-item:hover img { transform: scale(1.04); }

  footer {
    background: var(--bark); color: var(--cream);
    padding: 2.5rem 8rem;
    display: flex; justify-content: space-between; align-items: center;
  }
  .footer-brand { font-family: 'Playfair Display', serif; font-size: 1.1rem; }
  .footer-brand span { color: var(--straw); font-style: italic; }
  .footer-back { font-family: 'DM Sans', sans-serif; font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--cream); opacity: 0.55; text-decoration: none; transition: opacity 0.2s; }
  .footer-back:hover { opacity: 1; }

  @media (max-width: 1100px) {
    nav { padding: 1.2rem 2.5rem; }
    .gallery-header { padding: 9rem 4rem 3rem; }
    .gallery-grid { padding: 2rem 4rem 5rem; }
    footer { padding: 2.5rem 4rem; }
  }
  @media (max-width: 768px) {
    nav { padding: 1rem 1.5rem; }
    .gallery-header { padding: 8rem 2rem 2.5rem; }
    .gallery-grid { grid-template-columns: repeat(2, 1fr); padding: 1.5rem 1rem 4rem; }
    footer { padding: 2rem; flex-direction: column; gap: 1rem; text-align: center; }
  }
</style>
</head>
